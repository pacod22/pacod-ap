# Exporters — ALWAYS run on the APP host. They connect *into* Postgres/Redis and
# read host/container stats, so they must sit on `agent-net` next to the app.
# Ports are published on 127.0.0.1 for local debugging; for a separate-instance
# monitoring server, rebind them to a reachable interface (see README).
#
# Usage (from monitoring/): see the Makefile / README — brought up together with
# docker-compose.monitoring.yml on the same instance.
name: pacod-monitoring

networks:
  agent-net:
    external: true

services:
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      # Connects to Postgres DIRECTLY (not PgBouncer). Uses the app DB creds; a
      # dedicated read-only monitoring role is preferable in production.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-pacod}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pacod}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    networks: [agent-net]

  pgbouncer-exporter:
    # Requires a PgBouncer stats/admin user (see docker/postgres/pgbouncer.ini +
    # userlist.txt). Until that user exists this target may show DOWN — harmless.
    image: prometheuscommunity/pgbouncer-exporter:v0.10.2
    container_name: pgbouncer-exporter
    restart: unless-stopped
    command:
      - "--pgBouncer.connectionString=postgres://${POSTGRES_USER:-pacod}:${POSTGRES_PASSWORD}@pgbouncer:5432/pgbouncer?sslmode=disable"
    ports:
      - "127.0.0.1:9127:9127"
    networks: [agent-net]

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "127.0.0.1:9121:9121"
    networks: [agent-net]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks: [agent-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks: [agent-net]
