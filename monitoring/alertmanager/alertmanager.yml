# Alertmanager routing. The receiver is a STUB — fill in a real notification
# channel (Slack webhook, email SMTP, PagerDuty, etc.) before relying on alerts.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity = "critical"]
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # No notifier configured yet — alerts are visible in the Alertmanager UI
    # (http://localhost:9093) but not pushed anywhere. To enable Slack:
    #
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    #     channel: "#alerts"
    #     send_resolved: true
    #
    # Or email via a global smtp_* block + email_configs. See Alertmanager docs.

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname", "service"]
