# The relocatable monitoring SERVER: Prometheus + Alertmanager + Grafana.
#
# Same-instance (default): joins the shared external `pacod-net`, scrapes the app,
#   the exporters and the LLM gateway (pacod-gw:9100, pacod-gw's own Prometheus
#   series) by Docker DNS. UIs bound to 127.0.0.1 (tunnel in, or rebind).
#   These are the shared monitoring components (pacod-prometheus, pacod-alertmanager,
#   pacod-grafana) of pacod-ap's own stacks, `make up-all` included: the gateway
#   console's Metrics page asks this Prometheus. The full stack (pacod-demo) runs its
#   own and loads pacod-ap's scrape jobs from ../platform/prometheus/ap.yml.
#   This is the platform's one alerting stack: the gateway's rules are evaluated here
#   (prometheus/alerts/gw.rules.yml), its dashboards are in Grafana's "pacod-gw" folder.
#   Image versions follow pacod-gw's (its dashboards are made for Grafana 13).
# Separate-instance (future): run this file on its own host WITHOUT pacod-net,
#   set the *_TARGET vars in .env to the app host's published ports, and drop the
#   `networks` blocks below. See README.
name: pacod-monitoring

networks:
  pacod-net:
    external: true

volumes:
  pacod-prometheus-data:
  pacod-grafana-data:

services:
  pacod-prometheus:
    image: prom/prometheus:v3.15.0
    container_name: pacod-prometheus
    restart: unless-stopped
    # Render prometheus.yml from the template (envsubst-free, busybox sed) then exec.
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      # The platform's jobs (prometheus/prometheus.yml.tpl).
      CADDY_TARGET: "${CADDY_TARGET:-pacod-caddy:9180}"
      QDRANT_TARGET: "${QDRANT_TARGET:-pacod-qdrant:6333}"
      # The LLM gateway's core and the platform's identity provider.
      GW_CORE_TARGET: "${GW_CORE_TARGET:-pacod-gw:9100}"
      PACOD_ID_TARGET: "${PACOD_ID_TARGET:-pacod-id:9170}"
      POSTGRES_EXPORTER_TARGET: "${POSTGRES_EXPORTER_TARGET:-pacod-postgres-exporter:9187}"
      NODE_EXPORTER_TARGET: "${NODE_EXPORTER_TARGET:-pacod-node-exporter:9100}"
      CADVISOR_TARGET: "${CADVISOR_TARGET:-pacod-cadvisor:8080}"
      # pacod-ap's jobs (../platform/prometheus/ap.yml, the fragment the full stack loads).
      API_TARGET: "${API_TARGET:-ap-api:8000}"
      ADMIN_API_TARGET: "${ADMIN_API_TARGET:-ap-admin-api:8000}"
      MCP_TARGET: "${MCP_TARGET:-ap-mcp:8000}"
      EMBEDDINGS_TARGET: "${EMBEDDINGS_TARGET:-pacod-embeddings:8080}"
      INGESTION_TARGET: "${INGESTION_TARGET:-ap-ingestion:8000}"
      FRONTEND_TARGET: "${FRONTEND_TARGET:-ap-frontend:3000}"
      PGBOUNCER_EXPORTER_TARGET: "${PGBOUNCER_EXPORTER_TARGET:-ap-pgbouncer-exporter:9127}"
      REDIS_EXPORTER_TARGET: "${REDIS_EXPORTER_TARGET:-ap-redis-exporter:9121}"
    volumes:
      - ./prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      # Every product's scrape jobs; here pacod-ap's (ap.yml).
      - ../platform/prometheus:/etc/prometheus/scrape.d:ro
      - pacod-prometheus-data:/prometheus
    ports:
      # Not 9090 on the host: that port is often taken by another service.
      - "127.0.0.1:${PROMETHEUS_PORT:-9095}:9090"
    networks: [pacod-net]

  pacod-alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: pacod-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks: [pacod-net]

  pacod-grafana:
    image: grafana/grafana:13.2.3
    container_name: pacod-grafana
    restart: unless-stopped
    depends_on: [pacod-prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Served publicly behind Caddy at https://www.pacod.io/monitoring (see the
      # /monitoring handle in pacod-api/docker/caddy/Caddyfile). Grafana must emit
      # its asset/redirect URLs under that sub-path; Caddy does NOT strip the prefix.
      GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL:-https://www.pacod.io/monitoring/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Embedded in the admin console at /metrics (an iframe on www.pacod.io).
      # ALLOW_EMBEDDING removes Grafana's anti-framing headers; anonymous Viewer
      # lets the same-origin iframe render dashboards without a separate Grafana
      # login. Access is gated upstream by Caddy forward_auth (admins only) — see
      # the /monitoring handle in pacod-api/docker/caddy/Caddyfile. The admin
      # login below still works for editing.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_SECURITY_COOKIE_SAMESITE: "lax"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # pacod-gw's dashboards, vendored unchanged (datasource uid "prometheus").
      - ./grafana/dashboards-gw:/var/lib/grafana/dashboards-gw:ro
      - pacod-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    networks: [pacod-net]
