# Infrastructure alerts (Postgres, PgBouncer, Redis, node, containers).
# Starter set — metric names come from the standard exporters; tune thresholds.
groups:
  - name: pacod-infra
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL is down"
          description: "postgres_exporter reports pg_up=0 for >2m."

      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Redis is down"
          description: "redis_exporter reports redis_up=0 for >2m."

      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Postgres connection pool >80%"
          description: "Active connections exceed 80% of max_connections over 10m."

      - alert: PgBouncerPoolSaturated
        expr: |
          sum by (database) (pgbouncer_pools_server_active_connections)
            / clamp_min(sum by (database) (pgbouncer_pools_server_active_connections
              + pgbouncer_pools_server_idle_connections), 1) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "PgBouncer pool near saturation ({{ $labels.database }})"
          description: ">90% of PgBouncer server connections active over 10m."

      - alert: NodeDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "<10% free on {{ $labels.mountpoint }} over 10m."

      - alert: NodeMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Host memory >90%"
          description: "Available memory below 10% over 10m."

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} restarting"
          description: "{{ $labels.name }} restarted >2 times in 15m (possible crash loop)."
