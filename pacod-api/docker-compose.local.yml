# docker-compose.local.yml — LOCAL TEST OVERLAY of the app file. Never deploy this.
#
#   make up-local     (== docker compose -f docker-compose.yml -f docker-compose.local.yml \
#                          -f docker-compose.standalone.yml -f docker-compose.standalone.local.yml \
#                          --profile cpu --profile tools --profile ui up -d --build)
#
# The committed docker-compose.yml targets the server: it bind-mounts host paths
# under /data/** (logs) that do not exist on a laptop — and on
# macOS Docker Desktop cannot be created, because /data is outside the File
# Sharing list. Every such mount is redirected here to a NAMED VOLUME, which is
# host-agnostic and needs no configuration. The shared components (pacod-caddy,
# pacod-postgres, pacod-qdrant, pacod-id, pacod-mailpit) get their laptop values
# from docker-compose.standalone.local.yml: the Caddyfile swapped for
# docker/caddy/Caddyfile.local, the edge on high ports, Postgres on 15432.
#
#   http://localhost:8080   main shell (chat + admin console)
#   http://localhost:3001   ap-admin-api direct         (from the base compose)
#   http://localhost:8081   Adminer                     (tools profile)
#   127.0.0.1:8000          ap-api direct               (below)
#
# ---------------------------------------------------------------------------
# NOTE ON docker-compose.override.yml
# Compose auto-loads docker-compose.override.yml ONLY when no explicit -f is
# passed. The local targets pass -f, so that file is NOT read during a local
# run. Everything it did (redirecting the ap-api / ap-admin-api log mounts) is
# reproduced below, for every affected service rather than just those two.
# ---------------------------------------------------------------------------

# Every service rotates its container log the same way (pacod-demo/docs/LOGGING.md, section 2).
# YAML anchors do not cross files, so each compose file declares its own copy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # NB: the frontend deliberately gets NO `env_file` here. In production they
  # receive only the handful of variables listed in their compose `environment:`
  # block — handing them the backend `.env` would put the database password,
  # APP_SECRETS_KEY and the search and SMTP credentials inside a public-facing Node
  # process that has no use for them. Local overrides for these go through ${LOCAL_*}
  # interpolation instead, which is why those live in .env.local *and* are read
  # via --env-file.
  ap-frontend:
    logging: *logging
    environment:
      # Canonical/OG URLs must name the origin the browser actually used, or
      # every link preview and canonical points at production from a laptop.
      SITE_URL: ${LOCAL_PACOD_SITE_URL:-http://localhost:8080}
      # Two things this off switch buys locally: robots.txt becomes a blanket
      # `Disallow: /`, and the sitemap comes back empty — so a tunnelled or
      # accidentally-exposed local stack cannot be crawled.
      SITE_INDEXING_ENABLED: ${LOCAL_PACOD_SITE_INDEXING_ENABLED:-false}
      # Blank every ad/measurement id, verification token and IndexNow key so a
      # local click never fires a real pixel, pollutes production conversion
      # data, or claims ownership of a production domain. The `:-` defaults in
      # the base compose would otherwise pass whatever is in `.env` straight
      # through. Keep this list in step with the base compose: a key missing
      # here is a key that leaks into local runs.
      GOOGLE_SITE_VERIFICATION: ""
      BING_SITE_VERIFICATION: ""
      YANDEX_SITE_VERIFICATION: ""
      PINTEREST_SITE_VERIFICATION: ""
      FACEBOOK_DOMAIN_VERIFICATION: ""
      TIKTOK_SITE_VERIFICATION: ""
      GTM_ID: ""
      GA_MEASUREMENT_ID: ""
      GOOGLE_ADS_ID: ""
      GOOGLE_ADS_CONVERSION_LABEL: ""
      META_PIXEL_ID: ""
      META_APP_ID: ""
      TIKTOK_PIXEL_ID: ""
      X_PIXEL_ID: ""
      X_EVENT_IDS: ""
      YANDEX_METRICA_ID: ""
      MS_UET_TAG_ID: ""
      MS_CLARITY_ID: ""
      PINTEREST_TAG_ID: ""
      LINKEDIN_PARTNER_ID: ""
      LINKEDIN_CONVERSION_IDS: ""
      INDEXNOW_KEY: ""
      # Crawler tracking stays ON locally — it is how you exercise the feature
      # with a spoofed User-Agent — but reverse-DNS verification is OFF so a
      # laptop run makes no outbound DNS queries. Everything a local bot hit
      # produces therefore lands as `unknown`, which is the honest answer.
      CRAWLER_VERIFY_ENABLED: ${LOCAL_CRAWLER_VERIFY_ENABLED:-false}

  ap-api:
    logging: *logging
    # Production publishes nothing here — the browser only ever reaches the API
    # through Caddy → SvelteKit. Locally the api is also reachable directly, for
    # curl and scripts that call it with a dev token.
    #
    # Bound to 127.0.0.1 on purpose: it keeps the port — and with it the
    # dev-token bearer that `.env.local` enables — off the LAN.
    #
    # No `!override`: the base compose declares no `ports:` for api, so there is
    # no list to replace — only ones to append to.
    ports:
      - "127.0.0.1:8000:8000"
    # `.env.local` holds the local-only deltas (APP_ENV, APP_PUBLIC_BASE_URL,
    # a cheap model, …) and wins over `.env` because it is listed second.
    # `required: false` keeps the stack starting before you create it.
    env_file:
      - .env
      - path: .env.local
        required: false
    volumes:
      - ap-api-logs:/srv/logs

  ap-admin-api:
    logging: *logging
    env_file:
      - .env
      - path: .env.local
        required: false
    volumes:
      - ap-admin-api-logs:/srv/logs

  ap-ingestion:
    logging: *logging
    env_file:
      - .env
      - path: .env.local
        required: false
    volumes:
      - ap-ingestion-logs:/srv/logs

  ap-ingestion-cpu:
    logging: *logging
    env_file:
      - .env
      - path: .env.local
        required: false
    volumes:
      - ap-ingestion-cpu-logs:/srv/logs

  ap-improvement-loop:
    logging: *logging
    env_file:
      - .env
      - path: .env.local
        required: false
    volumes:
      - ap-improvement-loop-logs:/srv/logs

  ap-improvement-loop-worker:
    logging: *logging
    env_file:
      - .env
      - path: .env.local
        required: false
    volumes:
      - ap-improvement-loop-worker-logs:/srv/logs

  ap-newsletter-worker:
    logging: *logging
    env_file:
      - .env
      - path: .env.local
        required: false
    volumes:
      - ap-newsletter-worker-logs:/srv/logs

  # The MCP server checks the shared secret the api presents (fails closed), so
  # it must read the same .env.local the api reads.
  ap-mcp:
    logging: *logging
    env_file:
      - .env
      - path: .env.local
        required: false

  pacod-embeddings:
    logging: *logging
    # CPU PyTorch: the server image's ROCm wheel has no arm64 build (Apple
    # Silicon) and no laptop here has an AMD GPU anyway.
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    environment:
      # `auto` probes for CUDA/ROCm, which no laptop here has. Pin cpu so the
      # first boot doesn't spend time discovering that.
      EMBEDDINGS_DEVICE: cpu
      # bge-m3 is the real embedder and the default here, so local retrieval
      # behaves like production — at the cost of a ~2 GB model download on the
      # first `up` (cached in the pacod-embeddings-hf-cache volume afterwards) and slow CPU
      # inference. Set LOCAL_EMBEDDINGS_BACKEND=hash in .env.local for a stack
      # that boots in seconds — but be aware that hash embeddings are random
      # projections: KB retrieval returns nonsense, so it is only useful for
      # testing paths that don't depend on retrieval quality (auth, quotas,
      # admin CRUD).
      EMBEDDINGS_BACKEND: ${LOCAL_EMBEDDINGS_BACKEND:-bge}

volumes:
  ap-api-logs:
  ap-admin-api-logs:
  ap-ingestion-logs:
  ap-ingestion-cpu-logs:
  ap-improvement-loop-logs:
  ap-improvement-loop-worker-logs:
  ap-newsletter-worker-logs:
