[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    integration: requires the docker compose stack to be running
    slow: tests that take more than a few seconds
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
