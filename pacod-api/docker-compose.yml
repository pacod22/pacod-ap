# Development docker-compose stack.
#
# One replica per service. All stateful services (postgres, redis, qdrant)
# use named volumes so data survives `docker compose down`. Use
# `docker compose down -v` to wipe state.
#
# Bring up: docker compose up -d
# Bootstrap: docker compose exec api python -m scripts.init_db
#            docker compose exec api python -m scripts.seed_reference_facts --profile starter
#            docker compose exec ingestion python -m scripts.ingest_corpus --profile starter
# Tear down: docker compose down

name: pacod

services:
  # -----------------------------------------------------------------
  # Edge / reverse proxy
  # -----------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: pacod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data
      - /data/caddy/config:/config
      - /data/caddy/certs:/etc/caddy/certs
      - /data/caddy/logs:/var/log
    networks:
      - agent-net
      # The gateway console (gw-console) is on pacod-link; Caddy is the platform's only edge
      # and serves it, and pacod-id, on their own hosts (docker/caddy/Caddyfile).
      - pacod-link
    depends_on:
      api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      # NB: no depends_on for frontend — it is profile-gated ("ui") and started
      # separately (make up-ui), so this always-on proxy cannot hard-depend on it.
      # Caddy retries the upstream, serving 502 until the frontend is up.

  # -----------------------------------------------------------------
  # Application services
  # -----------------------------------------------------------------

  # SvelteKit admin shell — built from ../pacod-ui/frontend (the repo root's pacod-ui/).
  frontend:
    build:
      context: ../pacod-ui/frontend
      dockerfile: Dockerfile
      args:
        # pacod-id's origin goes into the build's CSRF trusted origins: its back-channel
        # logout is a cross-site POST, refused (403) without it.
        ID_ISSUER: ${PACOD_ID_ISSUER:-https://id.pacod.io}
    container_name: pacod-frontend
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      ADMIN_API_INTERNAL_URL: http://admin-api:8000
      # ≥32 characters (startup refuses less); generated by `make ensure-env`.
      SESSION_SECRET: ${SESSION_SECRET}
      # Server-side session store (required outside `vite dev`): the BFF's sessions, by
      # id and by pacod-id session (app_session:*, app_session_sid:*).
      REDIS_URL: ${FRONTEND_REDIS_URL:-redis://redis:6379/0}
      # pacod-id: people sign in there as the confidential client pacod-web; the
      # frontend holds their tokens server-side (a BFF). The internal
      # listener (on agent-net) is where sign-out ends the pacod-id session. The secret
      # is copied into .env.gateway (interpolation only) from deploy/secrets/id.env by make secrets-init.
      ID_ISSUER: ${PACOD_ID_ISSUER:-https://id.pacod.io}
      ID_INTERNAL_URL: http://pacod-id:8071
      ID_CLIENT_SECRET: ${PACOD_WEB_CLIENT_SECRET:-}
      OPENWEBUI_URL: ${OPENWEBUI_URL:-https://ctest.local:3000}
      OPENWEBUI_INTERNAL_URL: http://open-webui:8080
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env (openssl rand -base64 32)}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-admin@test.local}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?set WEBUI_ADMIN_PASSWORD in .env (a long random value)}
      # adapter-node body size limit — must cover the largest file upload (default: 512 KB).
      BODY_SIZE_LIMIT: "52428800"
      # UI languages the language switcher offers (CSV; base locale is en).
      ENABLED_LOCALES: ${ENABLED_LOCALES:-en,bg,de,ru}
      # Tell adapter-node which proxy headers carry the real host and protocol.
      # Without these, SvelteKit derives the origin from the internal Docker address
      # (frontend:3000) rather than the public hostname, breaking CSRF on form POSTs.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # --- SEO / social / advertising — PACOD ONLY ------------------------
      # Read at REQUEST time via $env/dynamic/private (lib/server/site-config.ts),
      # so changing any of these is `docker compose up -d frontend` — no rebuild.
      # Every one is optional: blank means "that integration is off", and the CSP
      # in hooks.server.ts stays closed for whatever is not configured.
      #
      # PRODUCTION DEFAULTS: every `:-` value below is what production runs with
      # when .env leaves the key unset — canonical https://www.pacod.io (Caddy 301s
      # the apex pacod.io there), indexing on. Account ids (pixels, counters,
      # verification tokens, profile URLs) and the IndexNow key have no safe
      # default and stay blank = off until configured.
      #
      # THE PREFIX RULE: .env holds the site's keys as PACOD_<KEY>, and this
      # service maps them onto neutral names. The frontend never gets an
      # env_file, so its environment holds only what is listed here.
      SITE_URL: ${PACOD_SITE_URL:-https://www.pacod.io}
      SITE_NAME: ${PACOD_SITE_NAME:-PACOD}
      SITE_OG_IMAGE: ${PACOD_SITE_OG_IMAGE:-/og-pacod.png}
      SITE_INDEXING_ENABLED: ${PACOD_SITE_INDEXING_ENABLED:-true}
      SOCIAL_FACEBOOK_URL: ${PACOD_SOCIAL_FACEBOOK_URL:-}
      SOCIAL_INSTAGRAM_URL: ${PACOD_SOCIAL_INSTAGRAM_URL:-}
      SOCIAL_YOUTUBE_URL: ${PACOD_SOCIAL_YOUTUBE_URL:-}
      SOCIAL_TIKTOK_URL: ${PACOD_SOCIAL_TIKTOK_URL:-}
      SOCIAL_X_URL: ${PACOD_SOCIAL_X_URL:-}
      SOCIAL_LINKEDIN_URL: ${PACOD_SOCIAL_LINKEDIN_URL:-}
      SOCIAL_PINTEREST_URL: ${PACOD_SOCIAL_PINTEREST_URL:-}
      SOCIAL_X_HANDLE: ${PACOD_SOCIAL_X_HANDLE:-}
      SOCIAL_WHATSAPP_NUMBER: ${PACOD_SOCIAL_WHATSAPP_NUMBER:-}
      SOCIAL_WHATSAPP_TEXT: ${PACOD_SOCIAL_WHATSAPP_TEXT:-}
      GOOGLE_SITE_VERIFICATION: ${PACOD_GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${PACOD_BING_SITE_VERIFICATION:-}
      YANDEX_SITE_VERIFICATION: ${PACOD_YANDEX_SITE_VERIFICATION:-}
      PINTEREST_SITE_VERIFICATION: ${PACOD_PINTEREST_SITE_VERIFICATION:-}
      FACEBOOK_DOMAIN_VERIFICATION: ${PACOD_FACEBOOK_DOMAIN_VERIFICATION:-}
      TIKTOK_SITE_VERIFICATION: ${PACOD_TIKTOK_SITE_VERIFICATION:-}
      GTM_ID: ${PACOD_GTM_ID:-}
      GA_MEASUREMENT_ID: ${PACOD_GA_MEASUREMENT_ID:-}
      GOOGLE_ADS_ID: ${PACOD_GOOGLE_ADS_ID:-}
      GOOGLE_ADS_CONVERSION_LABEL: ${PACOD_GOOGLE_ADS_CONVERSION_LABEL:-}
      META_PIXEL_ID: ${PACOD_META_PIXEL_ID:-}
      META_APP_ID: ${PACOD_META_APP_ID:-}
      TIKTOK_PIXEL_ID: ${PACOD_TIKTOK_PIXEL_ID:-}
      X_PIXEL_ID: ${PACOD_X_PIXEL_ID:-}
      X_EVENT_IDS: ${PACOD_X_EVENT_IDS:-}
      YANDEX_METRICA_ID: ${PACOD_YANDEX_METRICA_ID:-}
      MS_UET_TAG_ID: ${PACOD_MS_UET_TAG_ID:-}
      MS_CLARITY_ID: ${PACOD_MS_CLARITY_ID:-}
      PINTEREST_TAG_ID: ${PACOD_PINTEREST_TAG_ID:-}
      LINKEDIN_PARTNER_ID: ${PACOD_LINKEDIN_PARTNER_ID:-}
      LINKEDIN_CONVERSION_IDS: ${PACOD_LINKEDIN_CONVERSION_IDS:-}
      INDEXNOW_KEY: ${PACOD_INDEXNOW_KEY:-}
      YOUTUBE_EMBED_ENABLED: ${PACOD_YOUTUBE_EMBED_ENABLED:-false}
      # --- Crawler monitoring ---------------------------------------------
      # The frontend is the ONLY tier that sees crawler traffic: the public
      # vhost sends everything but /health to it, so a backend middleware would
      # record nothing. It classifies the User-Agent, counts it, and posts the
      # per-visit rows to admin-api over agent-net.
      CRAWLER_TRACKING_ENABLED: ${CRAWLER_TRACKING_ENABLED:-true}
      ANALYTICS_TRACKING_ENABLED: ${ANALYTICS_TRACKING_ENABLED:-true}
      CRAWLER_VERIFY_ENABLED: ${CRAWLER_VERIFY_ENABLED:-true}
      CRAWLER_INGEST_TOKEN: ${CRAWLER_INGEST_TOKEN:-}
    networks:
      - agent-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pacod-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_URL: http://embeddings:8080
      # The LLM gateway (pacod-gw, on pacod-link) and this service's own key, from
      # .env.gateway (make gw-bootstrap). Blank until then: LLM calls answer 401.
      GATEWAY_URL: http://gw-core:8080
      GATEWAY_API_KEY: ${GATEWAY_KEY_API:-}
      GATEWAY_CONSOLE_URL: ${GATEWAY_CONSOLE_URL:-https://console.pacod.io}
      # pacod-id (on agent-net): token checks and its feed, as the client pacod-api. The
      # client secret is copied into .env.gateway (interpolation only) by make secrets-init.
      ID_ISSUERS: ${PACOD_ID_ISSUER:-https://id.pacod.io}
      ID_INTERNAL_URL: http://pacod-id:8071
      ID_CLIENT_SECRET: ${PACOD_API_CLIENT_SECRET:-}
      MCP_SERVER_URL: http://mcp-server:8000
      APP_LOG_DIR: ${APP_LOG_DIR:-/srv/logs}
      PYTHONUNBUFFERED: "1"
    volumes:
      - documents_data:/srv/documents
      - /data/logs/api:/srv/logs
    networks:
      - agent-net
      - pacod-link
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

  admin-api:
    build:
      context: .
      dockerfile: docker/admin_api.Dockerfile
    container_name: pacod-admin-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_URL: http://embeddings:8080
      INGESTION_URL: http://ingestion:8000
      APP_LOG_DIR: ${APP_LOG_DIR:-/srv/logs}
      # The LLM gateway (pacod-gw, on pacod-link) and this service's own key, from
      # .env.gateway (make gw-bootstrap). Blank until then: LLM calls answer 401.
      GATEWAY_URL: http://gw-core:8080
      GATEWAY_API_KEY: ${GATEWAY_KEY_ADMIN_API:-}
      # Usage reports and quota overrides go to the gateway's management API; the
      # console's address is for deep links. Tokens and ids from .env.gateway.
      GATEWAY_ADMIN_URL: http://gw-core:8081
      GATEWAY_CONSOLE_URL: ${GATEWAY_CONSOLE_URL:-https://console.pacod.io}
      GATEWAY_ORG_ID: ${GATEWAY_ORG_ID:-}
      GATEWAY_WORKSPACE_ID: ${GATEWAY_WORKSPACE_ID:-}
      GATEWAY_REPORT_TOKEN: ${GATEWAY_REPORT_TOKEN:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      # pacod-id (on agent-net): token checks and its feed, as the client pacod-api. The
      # client secret is copied into .env.gateway (interpolation only) by make secrets-init.
      ID_ISSUERS: ${PACOD_ID_ISSUER:-https://id.pacod.io}
      ID_INTERNAL_URL: http://pacod-id:8071
      ID_CLIENT_SECRET: ${PACOD_API_CLIENT_SECRET:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /data/logs/admin-api:/srv/logs
    networks:
      - agent-net
      - pacod-link
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy
      # NB: no depends_on for ingestion — the ingestion backends are profile-gated
      # (gpu / cpu), so this always-on service cannot hard-depend on either. admin-api
      # delegates to ingestion over HTTP (INGESTION_URL) on demand and 502s if it is down.
    # Optional: expose for debugging via http://localhost:3001
    ports:
      - "127.0.0.1:3001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    container_name: pacod-ingestion
    profiles: ["gpu"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_URL: http://embeddings:8080
      APP_LOG_DIR: ${APP_LOG_DIR:-/srv/logs}
      PYTHONUNBUFFERED: "1"
    volumes:
      - documents_data:/srv/documents
      - /data/logs/ingestion:/srv/logs
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  ingestion-cpu:
    build:
      context: .
      dockerfile: docker/ingestion_cpu.Dockerfile
    container_name: pacod-ingestion-cpu
    profiles: ["cpu"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_BACKEND: inline_cpu
      INGEST_DOC_CONCURRENCY: "1"
      APP_LOG_DIR: ${APP_LOG_DIR:-/srv/logs}
      PYTHONUNBUFFERED: "1"
    mem_limit: 7g
    memswap_limit: 7g
    volumes:
      - documents_data:/srv/documents
      - /data/logs/ingestion-cpu:/srv/logs
    networks:
      agent-net:
        # The gpu (`ingestion`) and cpu (`ingestion-cpu`) backends are mutually
        # exclusive profiles, so alias this one to `ingestion` too — consumers
        # (admin-api, the loop) reach whichever backend is active at the single
        # stable hostname http://ingestion:8000, regardless of profile.
        aliases:
          - ingestion
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  # Continuous-improvement loop — a JOB container, not a daemon. Behind the "loop"
  # profile so `make up` never starts it as a long-running service; run it on a
  # schedule (host cron / systemd / k8s CronJob) with:
  #   docker compose run --rm improvement-loop run [--date YYYY-MM-DD] [--dry-run]
  # It can also run fully outside the stack (python -m improvement_loop run) as long
  # as it can reach Postgres/Qdrant/the gateway/embeddings — it does not need `api` up.
  improvement-loop:
    build:
      context: .
      dockerfile: docker/improvement_loop.Dockerfile
    container_name: pacod-improvement-loop
    profiles: ["loop"]
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_URL: http://embeddings:8080
      # The LLM gateway (pacod-gw, on pacod-link) and this service's own key, from
      # .env.gateway (make gw-bootstrap). Blank until then: LLM calls answer 401.
      GATEWAY_URL: http://gw-core:8080
      GATEWAY_API_KEY: ${GATEWAY_KEY_LOOP:-}
      INGESTION_URL: http://ingestion:8000
      APP_LOG_DIR: ${APP_LOG_DIR:-/srv/logs}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /data/logs/improvement-loop:/srv/logs
    networks:
      - agent-net
      - pacod-link
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy
      # NB: no depends_on for ingestion — it is profile-gated (gpu/cpu), so this
      # loop-profile job cannot hard-depend on it (would break `docker compose run
      # --rm improvement-loop`). It reaches ingestion over HTTP (INGESTION_URL),
      # best-effort, only under flag-gated auto-insert curation.

  # Always-on worker: drains the run-request queue (admin "Run now") and fires the
  # daily schedule. Same image as the one-shot job, started with the `worker` command.
  # Runs are serialised through this single executor.
  improvement-loop-worker:
    build:
      context: .
      dockerfile: docker/improvement_loop.Dockerfile
    container_name: pacod-improvement-loop-worker
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_URL: http://embeddings:8080
      # The LLM gateway (pacod-gw, on pacod-link) and this service's own key, from
      # .env.gateway (make gw-bootstrap). Blank until then: LLM calls answer 401.
      GATEWAY_URL: http://gw-core:8080
      GATEWAY_API_KEY: ${GATEWAY_KEY_LOOP:-}
      INGESTION_URL: http://ingestion:8000
      # Needed by the fix-verification stage, which runs a REAL agent turn in-process
      # (plan → tools → synthesize) to re-ask the question behind a claimed fix. The
      # structured-data tools go through MCP; without this the re-check silently
      # degrades to KB-only and would judge the agent on tools it never had.
      MCP_SERVER_URL: http://mcp-server:8000
      APP_LOG_DIR: ${APP_LOG_DIR:-/srv/logs}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /data/logs/improvement-loop-worker:/srv/logs
    networks:
      - agent-net
      - pacod-link
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy
      mcp-server:
        condition: service_started
      # NB: no depends_on for ingestion — both ingestion backends are profile-gated
      # (gpu / cpu), so an always-on worker cannot hard-depend on either. The worker
      # only reaches ingestion over HTTP (INGESTION_URL), best-effort, and only when
      # flag-gated auto-insert curation is on.

  # Always-on worker for the per-profile newsletter: drains the collect/send
  # run-request queue (admin "Collect now"/"Send now") and fires the calendar
  # schedules. Jobs are serialised through this single executor. Crawls the web +
  # calls the LLM gateway + sends SMTP — needs no Qdrant/embeddings/ingestion.
  newsletter-worker:
    build:
      context: .
      dockerfile: docker/newsletter_worker.Dockerfile
    container_name: pacod-newsletter-worker
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      # The LLM gateway (pacod-gw, on pacod-link) and this service's own key, from
      # .env.gateway (make gw-bootstrap). Blank until then: LLM calls answer 401.
      GATEWAY_URL: http://gw-core:8080
      GATEWAY_API_KEY: ${GATEWAY_KEY_NEWSLETTER:-}
      APP_LOG_DIR: ${APP_LOG_DIR:-/srv/logs}
      PYTHONUNBUFFERED: "1"
    volumes:
      - /data/logs/newsletter-worker:/srv/logs
    networks:
      - agent-net
      - pacod-link
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: pacod-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-pacod}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-pacod}
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  embeddings:
    build:
      context: .
      dockerfile: docker/embeddings.Dockerfile
    container_name: pacod-embeddings
    restart: unless-stopped
    environment:
      EMBEDDINGS_BACKEND: bge        # set to 'hash' for CI / lightweight dev
      EMBEDDINGS_DEVICE: ${EMBEDDINGS_DEVICE:-auto}   # auto|cpu|cuda
      RERANKER_BACKEND: ${RERANKER_BACKEND:-flag}     # flag|onnx_int8 (onnx = CPU path)
      RERANKER_ONNX_PATH: ${RERANKER_ONNX_PATH:-}     # dir of pre-quantized INT8 ONNX model
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - agent-net

  # -----------------------------------------------------------------
  # Stateful services
  # -----------------------------------------------------------------
  postgres:
    # The version pacod-id and pacod-gw are tested on.
    image: postgres:18.6-alpine3.24
    container_name: pacod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pacod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pacod}
    # Loopback only: the identity database (pacod_id) lives here too.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep the data in /var/lib/postgresql/18/docker; the volume is
      # mounted one level up so that a later major version can sit beside it for pg_upgrade.
      # A volume made by the old postgres:16 service (data at its root) is NOT read: start
      # from a fresh volume (make clean / clean-local).
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pacod} -d ${POSTGRES_DB:-pacod}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-init:
    image: postgres:18.6-alpine3.24
    container_name: pacod-postgres-init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - |
        psql -h postgres -U ${POSTGRES_USER:-pacod} -d postgres \
          -tc "SELECT 1 FROM pg_database WHERE datname = '${POSTGRES_OPENWEBUI_DB:-openwebui}'" \
          | grep -q 1 \
          || psql -h postgres -U ${POSTGRES_USER:-pacod} -d postgres \
             -c "CREATE DATABASE ${POSTGRES_OPENWEBUI_DB:-openwebui};"
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy

  pgbouncer:
    build:
      context: .
      dockerfile: docker/pgbouncer.Dockerfile
    container_name: pacod-pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-pacod}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-pacod}
      PGBOUNCER_DATABASE: ${POSTGRES_DB:-pacod}
      PGBOUNCER_DATABASE2: ${POSTGRES_OPENWEBUI_DB:-openwebui}
      PGBOUNCER_POOL_MODE: session
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_AUTH_TYPE: plain
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Identity: pacod-id (sign-in, accounts, roles) for the app and the gateway console.
  # ------------------------------------------------------------------
  # pacod-id's role and database in the same PostgreSQL: made on the first start, and kept in
  # step with PID_DB_PASSWORD on every start (docker/postgres/create-id-role.sh). Then it stops.
  pacod-id-db:
    image: postgres:18.6-alpine3.24
    container_name: pacod-id-db
    restart: "no"
    entrypoint: ["sh", "/create-id-role.sh"]
    env_file:
      - path: ../deploy/secrets/id.env
        required: false
    environment:
      # libpq's variables: nothing secret on the command line.
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-pacod}
      PGDATABASE: ${POSTGRES_DB:-pacod}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres/create-id-role.sh:/create-id-role.sh:ro
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy

  pacod-id:
    # Built from the pinned pacod-id tree by `make id-image` (PACOD_ID_SRC, default the copy
    # pacod-gw vendors); the tag is that tree's commit.
    image: ${PACOD_ID_IMAGE:-pacod-id:c4eb04b}
    container_name: pacod-id
    restart: unless-stopped
    command: ["serve"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Secrets (KEK, pepper, database password, client secrets, bootstrap admin) come from
    # deploy/secrets/id.env — `make secrets-init` writes it.
    env_file:
      - path: ../deploy/secrets/id.env
        required: false
    environment:
      PID_CONFIG: /etc/pacod-id/pacod-id.toml
      # Read by the configuration file. The issuer is the `iss` of every token: changing it
      # signs everybody out and breaks every client that checks it.
      PACOD_ID_ISSUER: ${PACOD_ID_ISSUER:-https://id.pacod.io}
      PACOD_PUBLIC_URL: ${PACOD_PUBLIC_URL:-https://www.pacod.io}
      PGW_CONSOLE_URL: ${PGW_CONSOLE_URL:-https://console.pacod.io}
      PACOD_ID_SELF_SIGNUP: ${PACOD_ID_SELF_SIGNUP:-true}
      # Caddy, on a private network, says who the client is.
      PID_TRUSTED_PROXIES: private_ranges
      PID_BOOTSTRAP_ADMIN_ROLES: id.admin,pacod.superuser,pacod.admin,gw.platform_admin
      PID_LOG_FORMAT: ${PID_LOG_FORMAT:-json}
      # Nothing that id.env sets may be named here: `environment:` wins over `env_file:`.
      # That includes PID_DATABASE_URL (a direct connection, never through PgBouncer —
      # pacod-id relies on LISTEN/NOTIFY; secrets-init writes it from PID_DB_PASSWORD) and the
      # account mail, PID_SMTP_* / PID_EMAIL_FROM_* (none: no mail is sent and none is asked
      # for, so sign-ups are not confirmed — set them in id.env for a deployment).
    volumes:
      - ./docker/pacod-id/pacod-id.toml:/etc/pacod-id/pacod-id.toml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9170/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # agent-net: the database, Caddy (public listener 8070) and the app (internal 8071).
    # pacod-link: the gateway's core, console and tester reach the internal listener by this
    # name. Not named "id", which is the gateway's own (switched off) identity service.
    networks:
      - agent-net
      - pacod-link
    depends_on:
      pacod-id-db:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: pacod-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pacod-qdrant
    restart: unless-stopped
    volumes:
      - /data/qdrant/storage:/qdrant/storage
    networks:
      - agent-net
    # Optional: expose for debugging via http://localhost:6333/dashboard
    ports:
      - "127.0.0.1:6333:6333"

  # -----------------------------------------------------------------
  # Dev-only inspection tools (uncomment ports as needed)
  # -----------------------------------------------------------------
  adminer:
    image: adminer:4.8.1
    container_name: pacod-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - agent-net
    profiles:
      - tools

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: pacod-openwebui
    restart: unless-stopped
    environment:
      # Builds the Docker image with NVIDIA CUDA
      USE_CUDA_DOCKER: False
      # Controls whether to use CUDA acceleration for local models
      USE_CUDA: False
      # Point Open-WebUI at the platform's OpenAI-compat endpoint.
      OPENAI_API_BASE_URL: http://api:8000/v1
      # The pacod-webui service account's token (pacod-id, role pacod.webui_service), from
      # .env.gateway (`make id-bootstrap`). Each call also forwards the person's identity in
      # X-OpenWebUI-User-* headers, which the API trusts from this account only, so usage,
      # quota and history are the person's. Blank until then: the
      # API refuses Open-WebUI's calls.
      OPENAI_API_KEY: ${PACOD_WEBUI_SERVICE_TOKEN:-}
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # This environment is Open-WebUI's configuration. By default Open-WebUI keeps the values
      # of its first boot in its database and ignores later changes here — a rotated service
      # token would never arrive, and a stale key keeps being sent. Settings changed in its
      # admin panel then last until the next restart.
      ENABLE_PERSISTENT_CONFIG: "False"
      # Which agents a person may use is the API's decision: every completion is
      # authorized as the forwarded person against their assignments (403 otherwise).
      # Open-WebUI's own per-model grants would only repeat it, and refuse every agent to
      # everyone but its admin until each model is registered by hand in its admin panel.
      BYPASS_MODEL_ACCESS_CONTROL: "True"
      # Enable per-user authentication.
      WEBUI_AUTH: True
      # Stable secret Open-WebUI signs its own session tokens with. The frontend has the
      # same value and derives each user's SSO password from it (lib/server/webui-sso.ts).
      # Rotate in production: openssl rand -base64 32
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env (openssl rand -base64 32)}
      # Admin account bootstrapped on first run — SvelteKit uses it to find/create users.
      # Must match WEBUI_ADMIN_EMAIL in the frontend service (default aligned).
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-admin@test.local}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?set WEBUI_ADMIN_PASSWORD in .env (a long random value)}
      # Pre-select the default agent (its profile slug is the model id).
      DEFAULT_MODELS: ${OPENWEBUI_DEFAULT_MODEL:-starter}
      # Friendly title shown in the UI header.
      WEBUI_NAME: ${OPENWEBUI_NAME:-PACOD}
      # Suppress Ollama connection attempts (we only use the OpenAI-compat API).
      ENABLE_OLLAMA_API: False
      # Tell Open-WebUI its public URL so Socket.IO origin checks pass.
      WEBUI_URL: ${OPENWEBUI_URL:-https://ctest.local:3000}
      # Must stay True: the SvelteKit SSO bridge (pacod-ui lib/server/webui-sso.ts)
      # signs in with passwords over agent-net. The PUBLIC password login is closed
      # at the Caddy edge instead (see the ai.pacod.io vhost).
      ENABLE_PASSWORD_AUTH: True
      # Global logging level — INFO: DEBUG logs request payloads, i.e. user chats.
      GLOBAL_LOG_LEVEL: INFO
      # Log format — include timestamp so log lines are easier to correlate
      LOG_FORMAT: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
      # Controls whether audit logs are written to a file
      ENABLE_AUDIT_LOGS_FILE: True
      # Configures where the audit log file is stored
      AUDIT_LOGS_FILE_PATH: /var/log/openwebui/audit.log
      # Controls the verbosity level of audit logging. METADATA records who/what/when
      # without request/response bodies — REQUEST_RESPONSE wrote every chat to disk.
      AUDIT_LOG_LEVEL: METADATA
      # The maximum size in bytes for request/response bodies in audit logs
      MAX_BODY_LOG_SIZE: 8196
      # Enables or disables code execution
      ENABLE_CODE_EXECUTION: False
      # Postgres integration for Open WebUI
      DATABASE_URL: postgresql://${POSTGRES_USER:-pacod}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_OPENWEBUI_DB:-openwebui}
      DATABASE_POOL_SIZE: 5
      DATABASE_POOL_MAX_OVERFLOW: 10
      REDIS_URL: redis://redis:6379/0
      WEBSOCKET_MANAGER: redis
      ENABLE_WEBSOCKET_SUPPORT: true
    volumes:
      - /data/openwebui/data:/app/backend/data
      - /data/openwebui/log:/var/log/openwebui
    networks:
      - agent-net
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

networks:
  agent-net:
    name: agent-net
    external: true
    driver: bridge
  # Shared with the gateway stack (deploy/pacod-gw/docker-compose.link.yml): its core
  # (gw-core), console (gw-console), tester and Prometheus (gw-prometheus) meet pacod-id and
  # the app here. Made by `make ensure-pacod-link`.
  pacod-link:
    name: pacod-link
    external: true

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  hf_cache:
  open_webui_data:
  documents_data:
