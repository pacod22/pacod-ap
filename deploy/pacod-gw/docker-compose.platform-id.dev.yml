# pacod-gw on the platform, the local addresses, for a laptop. Applied last, after pacod-gw's
# docker-compose.dev.yml, by `make gw-up` (GW_ENV=dev, the default).
#
#   pacod-id (issuer)    http://127.0.0.1:8070    pacod-ap's Caddy
#   console              http://127.0.0.1:13000   pacod-ap's Caddy
#   pacod-gw             127.0.0.1:18080 / 18081 / 19100 (data plane / management / metrics),
#                        published by pacod-gw's development file
#   gw-mock              127.0.0.1:19000, the scripted provider of platform-config.dev.json
#   Prometheus           http://127.0.0.1:9095, pacod-ap's monitoring module (make monitor-up)
#
# The ports are those of pacod-gw's own development stack, so the two cannot run at the same
# time; this one is the project pacod-ap-gw, with volumes of its own.

# Every service rotates its container log the same way (pacod-demo/docs/LOGGING.md, section 2).
# YAML anchors do not cross files, so each compose file declares its own copy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gw-preflight:
    logging: *logging
    environment:
      # The preflight check accepts only https:// addresses; the development ones are fixed
      # here instead (as pacod-gw's development file does for its own).
      PGW_ID_HOST: 127.0.0.1:8070
      PGW_ID_ISSUER: ""
      PGW_CONSOLE_HOST: 127.0.0.1:13000
      PGW_CONSOLE_URL: ""

  pacod-gw:
    logging: *logging
    environment:
      PGW_ID_ISSUER: http://127.0.0.1:8070
      PGW_CONSOLE_URL: http://127.0.0.1:13000
      # pacod-gw's development file fixes its own development password here, but the role
      # pacod_gw is pacod-ap's pacod-db-init's, with the password GW_DB_PASSWORD (gw.env).
      DATABASE_URL: postgres://pacod_gw:${GW_DB_PASSWORD:?deploy/secrets/gw.env}@pacod-postgres:5432/pacod_gw

  gw-console:
    logging: *logging
    environment:
      PGW_ID_ISSUER: http://127.0.0.1:8070
      PGW_CONSOLE_URL: http://127.0.0.1:13000
      GRAFANA_URL: ""
