# pacod-gw on the platform: the gateway signs people in through pacod-ap's pacod-id (one
# sign-in for the app and the console), and pacod-ap's Caddy and monitoring serve it.
#
# Applied after pacod-gw's app file (deploy/docker-compose.yml, + its docker-compose.dev.yml in
# dev) by the root Makefile (GW_COMPOSE, project pacod-ap-gw), never edited into them. Only
# the app file is loaded: the shared components it uses are pacod-ap's, on pacod-net, under
# the same names (pacod-demo/docs/NETWORK.md):
#
#   pacod-postgres   pacod-ap's; the database pacod_gw and its role come from pacod-ap's
#                    pacod-db-init, which runs pacod-gw's platform/postgres/gw-db.sh
#                    (docker-compose.gw-db.yml, the repo root's up targets)
#   pacod-id         pacod-ap's (http://pacod-id:8071, the issuer PACOD_ID_ISSUER)
#   pacod-caddy      pacod-ap's: it serves the console (gw-console:3000); nothing outside the
#                    platform calls the data plane, and the management API is never routed
#   pacod-prometheus pacod-ap's monitoring module (make monitor-up): the console's Metrics
#                    page and the only alert owner
#
# Its --env-file is deploy/secrets/gw.env (`make secrets-init`), never pacod-gw/deploy/.env:
# the client secrets below are the ones pacod-id has in deploy/secrets/id.env, and the
# generator writes both. Every `${VAR:?}` below must come from gw.env; compose stops with the
# variable's name when one is missing. A value set under `environment:` in pacod-gw's own files
# is replaced here, because `environment:` keys of a later file win (env_file never would).

x-identity: &identity
  PGW_AUTH: oidc
  PGW_ID_ISSUER: ${PACOD_ID_ISSUER:-https://id.pacod.io}
  PGW_ID_INTERNAL_URL: http://pacod-id:8071

# Every service rotates its container log the same way (pacod-demo/docs/LOGGING.md, section 2).
# YAML anchors do not cross files, so each compose file declares its own copy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Preflight still checks pacod-id's secrets in OIDC mode, for the identity service it
  # expects next to it. That service is pacod-ap's here, with secrets of its own, so these
  # three are placeholders that nothing reads. The client secrets are the real ones.
  gw-preflight:
    logging: *logging
    environment:
      PGW_AUTH: oidc
      PGW_ID_HOST: ${PACOD_ID_HOST:-id.pacod.io}
      PGW_ID_ISSUER: ${PACOD_ID_ISSUER:-https://id.pacod.io}
      PGW_CONSOLE_HOST: ${PGW_CONSOLE_HOST:-console.pacod.io}
      PGW_CONSOLE_URL: ${PGW_CONSOLE_URL:-https://console.pacod.io}
      PID_DB_PASSWORD: unused-pacod-id-runs-in-pacod-ap
      PID_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PID_TOKEN_PEPPER: unused-pacod-id-runs-in-pacod-ap-000000
      PGW_ID_CLIENT_SECRET: ${PGW_ID_CLIENT_SECRET:?run make secrets-init}
      PGW_UI_CLIENT_SECRET: ${PGW_UI_CLIENT_SECRET:?run make secrets-init}
      TESTER_ID_CLIENT_SECRET: ${TESTER_ID_CLIENT_SECRET:?run make secrets-init}
      PGW_UI_SESSION_SECRET: ${PGW_UI_SESSION_SECRET:?run make secrets-init}

  pacod-gw:
    logging: *logging
    environment:
      <<: *identity
      PGW_ID_CLIENT_SECRET: ${PGW_ID_CLIENT_SECRET:?run make secrets-init}
      PGW_CONSOLE_URL: ${PGW_CONSOLE_URL:-https://console.pacod.io}

  gw-console:
    logging: *logging
    environment:
      <<: *identity
      PGW_UI_CLIENT_SECRET: ${PGW_UI_CLIENT_SECRET:?run make secrets-init}
      PGW_UI_SESSION_SECRET: ${PGW_UI_SESSION_SECRET:?run make secrets-init}
      PGW_CONSOLE_URL: ${PGW_CONSOLE_URL:-https://console.pacod.io}
      # pacod-ap's Prometheus (monitoring/), which scrapes the core as job pacod-gw-core.
      PROMETHEUS_URL: http://pacod-prometheus:9090
      GRAFANA_URL: ${PGW_GRAFANA_URL:-}

  # The shared components pacod-gw's app file waits for (depends_on, required: false) are
  # pacod-ap's, in pacod-ap's own compose project. Compose refuses a depends_on on a service
  # the project does not define, even an optional one, so they are named here, in a profile
  # nothing enables: never started by this project, only skipped. `make up-all` starts
  # pacod-ap's stack (and its pacod-db-init) before this one.
  pacod-postgres: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-db-init: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-id: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-caddy: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-otel: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-prometheus: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-alertmanager: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-grafana: {profiles: [pacod-ap-provides], logging: *logging}
  pacod-mailpit: {profiles: [pacod-ap-provides], logging: *logging}

  gw-tester:
    logging: *logging
    environment:
      PGW_AUTH: oidc
      PGW_ID_INTERNAL_URL: http://pacod-id:8071
      TESTER_ID_CLIENT_SECRET: ${TESTER_ID_CLIENT_SECRET:?run make secrets-init}
