# pacod-gw's database on pacod-ap's PostgreSQL: hands pacod-gw's fragment
# (GW_DIR/platform/postgres/gw-db.sh: the role and the database pacod_gw) to pacod-ap's
# pacod-db-init, which runs it with the others at every start. Its password, GW_DB_PASSWORD,
# comes from deploy/secrets/gw.env (an env_file of pacod-db-init; `make secrets-init` writes
# it), the same value pacod-gw's DATABASE_URL is made from.
#
# Loaded into pacod-ap's project (pacod-api/), not the gateway's: the repo root's up targets
# (up, up-api, up-local, up-all) pass it to pacod-api/Makefile as AP_EXTRA_FILES, with GW_DIR
# (absolute) in the environment, whenever GW_DIR holds the fragment.

# Every service rotates its container log the same way (pacod-demo/docs/LOGGING.md, section 2).
# YAML anchors do not cross files, so each compose file declares its own copy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  pacod-db-init:
    logging: *logging
    volumes:
      - type: bind
        source: ${GW_DIR:?the pacod-gw checkout}/platform/postgres/gw-db.sh
        target: /initdb.d/gw-db.sh
        read_only: true
        # A missing fragment stops the start instead of becoming an empty directory.
        bind:
          create_host_path: false
